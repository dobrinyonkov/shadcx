name: opencode

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model"
        required: false
        default: "opencode-go/deepseek-v4-pro"
        type: string

      prompt:
        description: "Prompt for opencode"
        required: true
        type: string

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ inputs.model }}
          prompt: ${{ inputs.prompt }}
