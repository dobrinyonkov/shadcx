name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build
        env:
          BASE_PATH: /shadcx/pr-preview/${{ github.event.pull_request.number }}/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-preview/${{ github.event.pull_request.number }}
          keep_files: true
      - uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: pr-preview
          message: |
            Preview: https://dobrinyonkov.github.io/shadcx/pr-preview/${{ github.event.pull_request.number }}/
